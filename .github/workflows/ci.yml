name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: ruff check src/agent src/rag src/main.py
      - run: pytest tests/ -v --tb=long --ignore=tests/test_rag.py 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log